# English Mastery Hub - Local Keycloak SSO Server (OIDC + PKCE)
# Chạy bằng lệnh: docker compose -f docker-compose.keycloak.yml up -d
# Sau đó mở http://localhost:8080 (admin / admin123) tạo Realm: "english-mastery"
# và Client (Public, Standard Flow + PKCE): "english-mastery-web"
# Redirect URI: http://localhost:8000/* và http://127.0.0.1:8000/*
# Web Origins: *
services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: emh-keycloak
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin123
      KC_HTTP_PORT: 8080
    ports:
      - "8080:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
    restart: unless-stopped

volumes:
  keycloak_data:
